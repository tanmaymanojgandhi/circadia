name: Lint & Validate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    name: Syntax & Lint Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Lua for native compiler check
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Native Lua compiler syntax check
        run: luac -p ports/neovim/lua/circadia/*.lua

      - name: Run Unified Linter
        run: npm run lint
