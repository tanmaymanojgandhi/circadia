# Circadia — Circadia Dark Plum
# OKLCH color theme; see spec/rules.md for contrast validation coverage

[metadata]
name = "Circadia Dark Plum"
author = "Tanmay Manoj Gandhi <https://github.com/tanmaymanojgandhi>"
origin_url = "https://github.com/tanmaymanojgandhi/circadia"

[colors]
foreground = "#cbc9c4"
background = "#140e12"

cursor_bg = "#b6a3d1"
cursor_fg = "#140e12"
cursor_border = "#b6a3d1"

selection_bg = "#261e23"
selection_fg = "#cbc9c4"

scrollbar_thumb = "#3d3039"
split = "#3d3039"

ansi = [
  "#140e12",
  "#dfbb87",
  "#a9c98e",
  "#e0b27c",
  "#83bfd5",
  "#c3abe0",
  "#e0b27c",
  "#cbc9c4",
]

brights = [
  "#b8b4ac",
  "#dfbb87",
  "#a9c98e",
  "#e0b27c",
  "#83bfd5",
  "#ddabc2",
  "#e0b27c",
  "#cbc9c4",
]

[colors.tab_bar]
background = "#140e12"
inactive_tab_edge = "#3d3039"

[colors.tab_bar.active_tab]
bg_color = "#1b1419"
fg_color = "#b6a3d1"
intensity = "Bold"
underline = "None"
italic = false
strikethrough = false

[colors.tab_bar.inactive_tab]
bg_color = "#140e12"
fg_color = "#bdbab3"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#261e23"
fg_color = "#cbc9c4"
italic = true

[colors.tab_bar.new_tab]
bg_color = "#140e12"
fg_color = "#bdbab3"

[colors.tab_bar.new_tab_hover]
bg_color = "#261e23"
fg_color = "#cbc9c4"
italic = true
