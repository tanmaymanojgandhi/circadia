# Circadia — Circadia Light
# OKLCH color theme; see spec/rules.md for contrast validation coverage

[metadata]
name = "Circadia Light"
author = "Tanmay Manoj Gandhi <https://github.com/tanmaymanojgandhi>"
origin_url = "https://github.com/tanmaymanojgandhi/circadia"

[colors]
foreground = "#28323a"
background = "#f7f4ec"

cursor_bg = "#003fa0"
cursor_fg = "#f7f4ec"
cursor_border = "#003fa0"

selection_bg = "#e5e0d5"
selection_fg = "#28323a"

scrollbar_thumb = "#d2cbbf"
split = "#d2cbbf"

ansi = [
  "#e5e0d5",
  "#843900",
  "#005f2f",
  "#095b62",
  "#0048b3",
  "#7a1f7a",
  "#095b62",
  "#28323a",
]

brights = [
  "#43505c",
  "#1c60a2",
  "#005f2f",
  "#1c4470",
  "#0048b3",
  "#4b1fa3",
  "#0048b3",
  "#28323a",
]

[colors.tab_bar]
background = "#efebe2"
inactive_tab_edge = "#d2cbbf"

[colors.tab_bar.active_tab]
bg_color = "#f7f4ec"
fg_color = "#003fa0"
intensity = "Bold"
underline = "None"
italic = false
strikethrough = false

[colors.tab_bar.inactive_tab]
bg_color = "#efebe2"
fg_color = "#394652"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#e5e0d5"
fg_color = "#28323a"
italic = true

[colors.tab_bar.new_tab]
bg_color = "#efebe2"
fg_color = "#394652"

[colors.tab_bar.new_tab_hover]
bg_color = "#e5e0d5"
fg_color = "#28323a"
italic = true
