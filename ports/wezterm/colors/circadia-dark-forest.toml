# Circadia — Circadia Dark Forest
# OKLCH color theme; see spec/rules.md for contrast validation coverage

[metadata]
name = "Circadia Dark Forest"
author = "Tanmay Manoj Gandhi <https://github.com/tanmaymanojgandhi>"
origin_url = "https://github.com/tanmaymanojgandhi/circadia"

[colors]
foreground = "#cbc9c4"
background = "#131714"

cursor_bg = "#a5c3a4"
cursor_fg = "#131714"
cursor_border = "#a5c3a4"

selection_bg = "#242a25"
selection_fg = "#cbc9c4"

scrollbar_thumb = "#353c36"
split = "#353c36"

ansi = [
  "#131714",
  "#dfbb87",
  "#a9c98e",
  "#e0b27c",
  "#83bfd5",
  "#c3abe0",
  "#e0b27c",
  "#cbc9c4",
]

brights = [
  "#b8b4ac",
  "#dfbb87",
  "#a9c98e",
  "#e0b27c",
  "#83bfd5",
  "#ddabc2",
  "#e0b27c",
  "#cbc9c4",
]

[colors.tab_bar]
background = "#131714"
inactive_tab_edge = "#353c36"

[colors.tab_bar.active_tab]
bg_color = "#1a1e1b"
fg_color = "#a5c3a4"
intensity = "Bold"
underline = "None"
italic = false
strikethrough = false

[colors.tab_bar.inactive_tab]
bg_color = "#131714"
fg_color = "#bdbab3"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#242a25"
fg_color = "#cbc9c4"
italic = true

[colors.tab_bar.new_tab]
bg_color = "#131714"
fg_color = "#bdbab3"

[colors.tab_bar.new_tab_hover]
bg_color = "#242a25"
fg_color = "#cbc9c4"
italic = true
