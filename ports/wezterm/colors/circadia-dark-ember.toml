# Circadia — Circadia Dark Ember
# OKLCH color theme; see spec/rules.md for contrast validation coverage

[metadata]
name = "Circadia Dark Ember"
author = "Tanmay Manoj Gandhi <https://github.com/tanmaymanojgandhi>"
origin_url = "https://github.com/tanmaymanojgandhi/circadia"

[colors]
foreground = "#cbc9c4"
background = "#17130f"

cursor_bg = "#d6b078"
cursor_fg = "#17130f"
cursor_border = "#d6b078"

selection_bg = "#29241e"
selection_fg = "#cbc9c4"

scrollbar_thumb = "#3b342b"
split = "#3b342b"

ansi = [
  "#17130f",
  "#dfbb87",
  "#a9c98e",
  "#e0b27c",
  "#83bfd5",
  "#c3abe0",
  "#e0b27c",
  "#cbc9c4",
]

brights = [
  "#b8b4ac",
  "#dfbb87",
  "#a9c98e",
  "#e0b27c",
  "#83bfd5",
  "#ddabc2",
  "#e0b27c",
  "#cbc9c4",
]

[colors.tab_bar]
background = "#17130f"
inactive_tab_edge = "#3b342b"

[colors.tab_bar.active_tab]
bg_color = "#1e1a15"
fg_color = "#d6b078"
intensity = "Bold"
underline = "None"
italic = false
strikethrough = false

[colors.tab_bar.inactive_tab]
bg_color = "#17130f"
fg_color = "#bdbab3"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#29241e"
fg_color = "#cbc9c4"
italic = true

[colors.tab_bar.new_tab]
bg_color = "#17130f"
fg_color = "#bdbab3"

[colors.tab_bar.new_tab_hover]
bg_color = "#29241e"
fg_color = "#cbc9c4"
italic = true
